name: "BND-LG360 APK Oluşturucu"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: "Flutter APK Derle"
    runs-on: ubuntu-latest

    steps:
      - name: "Depoyu Klonla"
        uses: actions/checkout@v4

      - name: "Java 17 Kurulumu"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Flutter Kurulumu"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: "Bağımlılıkları Yükle (pub get)"
        run: flutter pub get

      - name: "Android APK Derle (Release)"
        run: flutter build apk --release --no-tree-shake-icons

      - name: "APK Dosyasını Yükle (Artifact)"
        uses: actions/upload-artifact@v4
        with:
          name: BND-LG360-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
